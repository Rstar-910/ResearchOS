[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "researchos"
version = "0.1.0"
description = "Persistent, evidence-first research workflows"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "langgraph>=1,<2",
  "httpx[http2]>=0.28,<1",
  "beautifulsoup4>=4.15.0",
  "pymupdf>=1.28.2",
  "trafilatura>=2.3.1",
  "numpy>=2.5.3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".uv-cache"]

[tool.ruff.lint]
select = ["E", "F", "I"]
